# Central source registry for Espressif documentation.
# Every fact in data/chips/*.yaml references one of these IDs instead of
# repeating the URL/version inline. Update a datasheet version here once —
# every chip file that cites it inherits the correction automatically.
#
# Fields:
#   id          unique key, referenced as source_ref in chip files
#   title       human-readable document title
#   version     document version string as printed by the vendor
#   url         canonical URL (documentation.espressif.com preferred over
#               www.espressif.com/sites/default/files/... mirrors, which are
#               being phased out)
#   accessed    ISO date this URL/version was last confirmed to resolve
#   status      "verified" | "unverified" | "no_public_pdf"

sources:

  - id: esp32_ds
    title: "ESP32 Series Datasheet"
    version: "5.3"
    url: "https://documentation.espressif.com/esp32_datasheet_en.pdf"
    accessed: "2026-08-16"
    status: verified

