id: ESP32-E22
name: "ESP32-E22"
status: sampling
family_notes: >
  Radio Co-Processor (RCP) architecture — not a standalone MCU. Fields like
  gpio_count/adc_channels/pwm reflect the RCP's own die, not a system built
  around it; a host processor is always required. No standalone series
  datasheet PDF was publicly indexed at last check (2026-08-16) — facts
  below are sourced from Espressif's product page and press announcement,
  not a datasheet. Treat with the same "status: no_public_pdf" caution as
  the source registry entries.

architecture:
  cores:         { value: 2, source_ref: esp32e22_announcement, last_verified: "2026-08-16", note: "proprietary Espressif RISC-V cores" }
  isa:           { value: "RISC-V", source_ref: esp32e22_announcement, last_verified: "2026-08-16" }
  clock_max_mhz: { value: 500, source_ref: esp32e22_announcement, last_verified: "2026-08-16" }
  has_lp_core:   { value: false, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "low-power state managed by host, no dedicated LP core on-die" }

memory:
  sram_kb:           { value: 1024, source_ref: esp32e22_product_page, last_verified: "2026-08-16" }
  embedded_flash_mb: { value: 0, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "RCP design, no embedded flash" }
  embedded_psram_mb: { value: 0, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "memory via host" }

radios:
  wifi:
    value: true
    detail: "Tri-band Wi-Fi 6E, 2.4/5/6 GHz, 160 MHz BW, 2x2 MU-MIMO, up to 2.4 Gbps"
    source_ref: esp32e22_announcement
    last_verified: "2026-08-16"
  bluetooth:
    value: true
    detail: "Bluetooth Classic (BR/EDR) + BLE 5.4"
    source_ref: esp32e22_announcement
    last_verified: "2026-08-16"
  ieee802_15_4:
    value: false
    source_ref: esp32e22_product_page
    last_verified: "2026-08-16"

interfaces:
  gpio_count: { value: 30, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "primarily reserved for host interface, not general-purpose in the usual sense" }
  usb_otg:    { value: "2.0", source_ref: esp32e22_announcement, last_verified: "2026-08-16", note: "host interface option, alongside PCIe 2.1 / SDIO 3.0" }
  camera:     { value: false, source_ref: esp32e22_product_page, last_verified: "2026-08-16" }
  ethernet_mac_mbps: { value: null, source_ref: esp32e22_product_page, last_verified: "2026-08-16" }
  can_twai_count:    { value: 0, source_ref: esp32e22_product_page, last_verified: "2026-08-16" }
  adc_channels:      { value: 0, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "no ADC peripheral listed; RCP not designed for standalone sensing" }
  pwm:        { value: false, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "no PWM peripheral listed" }

power:
  deep_sleep_ua: { value: null, source_ref: esp32e22_product_page, last_verified: "2026-08-16", note: "not applicable in the usual sense — power state is host-controlled" }
