id: ESP32-S31
name: "ESP32-S31"
status: mass_production
family_notes: >
  Entered mass production 2026-07-27 per Espressif's press announcement.
  No standalone series datasheet PDF was publicly indexed at last check
  (2026-08-16); facts below are sourced from the product page and mass-
  production announcement. deep_sleep_ua is intentionally null — this is
  the PoC's worked example of "we do not know yet" being a first-class,
  explicit machine-readable state rather than a silently omitted table
  cell or a guessed number.

architecture:
  cores:         { value: 2, source_ref: esp32s31_mass_production, last_verified: "2026-08-16", note: "1 HP core w/ 128-bit SIMD + 1 LP core" }
  isa:           { value: "RISC-V", source_ref: esp32s31_mass_production, last_verified: "2026-08-16" }
  clock_max_mhz: { value: 320, source_ref: esp32s31_mass_production, last_verified: "2026-08-16" }
  has_lp_core:   { value: true, source_ref: esp32s31_mass_production, last_verified: "2026-08-16", note: "40 MHz LP RISC-V core" }

memory:
  sram_kb:           { value: 512, source_ref: esp32s31_mass_production, last_verified: "2026-08-16" }
  embedded_flash_mb: { value: 0, source_ref: esp32s31_product_page, last_verified: "2026-08-16", note: "external Flash/PSRAM via Octal SPI only" }
  embedded_psram_mb: { value: 0, source_ref: esp32s31_product_page, last_verified: "2026-08-16" }

radios:
  wifi:
    value: true
    detail: "Wi-Fi 6, 2.4 GHz (802.11ax)"
    source_ref: esp32s31_mass_production
    last_verified: "2026-08-16"
  bluetooth:
    value: true
    detail: "Bluetooth 5.4, LE Audio + Classic BR/EDR, Mesh 1.1"
    source_ref: esp32s31_mass_production
    last_verified: "2026-08-16"
  ieee802_15_4:
    value: true
    detail: "802.15.4, Zigbee + Thread, Matter over Wi-Fi and Thread"
    source_ref: esp32s31_mass_production
    last_verified: "2026-08-16"

interfaces:
  gpio_count: { value: 60, source_ref: esp32s31_mass_production, last_verified: "2026-08-16" }
  usb_otg:    { value: "2.0", source_ref: esp32s31_product_page, last_verified: "2026-08-16" }
  camera:     { value: true, source_ref: esp32s31_mass_production, last_verified: "2026-08-16", note: "DVP camera interface, 8-16 bit" }
  ethernet_mac_mbps: { value: 1000, source_ref: esp32s31_mass_production, last_verified: "2026-08-16" }
  can_twai_count:    { value: 1, source_ref: esp32s31_product_page, last_verified: "2026-08-16" }
  adc_channels:      { value: null, source_ref: esp32s31_product_page, last_verified: "2026-08-16", note: "ADC present, channel count not yet published" }
  pwm:        { value: true, source_ref: esp32s31_product_page, last_verified: "2026-08-16" }

power:
  deep_sleep_ua: { value: null, source_ref: esp32s31_product_page, last_verified: "2026-08-16", note: "not yet published — deliberately left null, see family_notes" }
