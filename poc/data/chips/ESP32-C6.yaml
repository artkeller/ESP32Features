id: ESP32-C6
name: "ESP32-C6"
status: mass_production

architecture:
  cores:         { value: 2, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "1 HP + 1 LP RISC-V core" }
  isa:           { value: "RISC-V", source_ref: esp32c6_ds, last_verified: "2026-08-16" }
  clock_max_mhz: { value: 160, source_ref: esp32c6_ds, last_verified: "2026-08-16" }
  has_lp_core:   { value: true, source_ref: esp32c6_ds, last_verified: "2026-08-16" }

memory:
  sram_kb:           { value: 512, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "HP SRAM; +16 KB LP SRAM" }
  embedded_flash_mb: { value: 8, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "variant-dependent, 0/4/8 MB" }
  embedded_psram_mb: { value: 0, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "PSRAM external only" }

radios:
  wifi:
    value: true
    detail: "Wi-Fi 6, 2.4 GHz only (802.11ax/b/g/n)"
    source_ref: esp32c6_ds
    last_verified: "2026-08-16"
  bluetooth:
    value: true
    detail: "Bluetooth 5.3 LE + Mesh"
    source_ref: esp32c6_ds
    last_verified: "2026-08-16"
  ieee802_15_4:
    value: true
    detail: "802.15.4, Zigbee 3.0 / Thread 1.3"
    source_ref: esp32c6_ds
    last_verified: "2026-08-16"

interfaces:
  gpio_count: { value: 30, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "30 (QFN40) / 22 (QFN32)" }
  usb_otg:    { value: null, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "USB Serial/JTAG only, no OTG" }
  camera:     { value: false, source_ref: esp32c6_ds, last_verified: "2026-08-16" }
  ethernet_mac_mbps: { value: null, source_ref: esp32c6_ds, last_verified: "2026-08-16" }
  can_twai_count:    { value: 1, source_ref: esp32c6_ds, last_verified: "2026-08-16" }
  adc_channels:      { value: 7, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "12-bit SAR ADC" }
  pwm:        { value: true, source_ref: esp32c6_ds, last_verified: "2026-08-16", note: "LEDC + MCPWM (3 ch.)" }

power:
  deep_sleep_ua: { value: 7, source_ref: esp32c6_ds, last_verified: "2026-08-16" }
